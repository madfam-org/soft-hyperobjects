name: CI

# The commons verification bar. This repository holds objects, not platform code,
# so its CI reads the bar from an installable package (`hyperobjects-spec`) and
# never checks out a platform — that is the "keystone rule" of RFC 0038 §9.
#
# Two jobs, and the split between them is the honest one:
#
#   manifests  — conformance over every cartridge. Needs nothing but the keystone
#                package. ALWAYS runs, always blocking.
#   patterns   — render + seam parity. Needs the `fc` drafting kernel, which lives
#                in the PRIVATE platform repository. SKIPS WITH A VISIBLE NOTICE
#                while the read token is unset (see the job's own comment).
#
# ADR-010: no GitHub-hosted compute for our own lanes. Jobs run on the self-hosted
# pool; the `ARC_BOOTSTRAP_COMPLETE` expression is the standard bootstrap fallback
# so a brand-new repository is not dead-in-the-water before the pool is attached.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full pattern sweep, 09:30Z (03:30 CDMX). The per-PR `patterns`
    # job below verifies every cartridge too, but it is gated on a kernel token
    # that may be absent; the nightly is the lane whose RED reaches a human.
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      report_fixture:
        description: >-
          Exercise the tracking-issue reporter against a committed fixture log
          instead of rendering (e.g. .github/fixtures/nightly-fail-sample.txt).
          Leave blank for a normal run.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The keystone pin. Bumping it is a deliberate act: it changes the bar every
  # cartridge in this repository is held to.
  SPEC_PIN: 53e972dd121a07de68a67e2b3f7699a5550376a2

jobs:
  manifests:
    name: Manifest conformance (fc-spec)
    # The PR bar. The nightly sweep is `patterns-nightly` below.
    if: github.event_name != 'schedule'
    # ADR-010: prefer the self-hosted pool once the ARC bootstrap is complete,
    # fall back to GitHub-hosted so the lane still runs before/if it is not.
    runs-on: ${{ vars.CI_RUNNER_LABEL != '' && vars.CI_RUNNER_LABEL || 'madfam-runners-blue' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the keystone (no platform checkout)
        env:
          SPEC_READ_TOKEN: ${{ secrets.MADFAM_BOT_PAT }}
        run: |
          # hyperobjects-spec is private today: use the read token when the secret is set,
          # fall back to the public URL, and fail LOUD naming the operator step otherwise.
          if [ -n "${SPEC_READ_TOKEN}" ]; then
            SPEC_URL="git+https://x-access-token:${SPEC_READ_TOKEN}@github.com/madfam-org/hyperobjects-spec@${SPEC_PIN}"
          else
            SPEC_URL="git+https://github.com/madfam-org/hyperobjects-spec@${SPEC_PIN}"
          fi
          if ! pip install "hyperobjects-spec @ ${SPEC_URL}"; then
            echo "::error title=keystone not installable::hyperobjects-spec could not be cloned at ${SPEC_PIN} — the repo is private and no read token reached this job. Operator step: make madfam-org/hyperobjects-spec public (RFC 0038 §9 keystone posture) or set the repository secret MADFAM_BOT_PAT with read access to it."
            exit 1
          fi
          fc-spec list

      - name: Every cartridge is a complete triple
        # Read-proof, in the house style: it prints what it scanned and a zero
        # read is itself a failure. `fc-spec` checks the manifests it is handed;
        # nothing but this step notices a cartridge that ships NO manifest.
        run: |
          python3 - <<'PY'
          import pathlib, sys

          root = pathlib.Path(".")
          slugs = sorted(
              p.name for p in root.iterdir()
              if p.is_dir() and not p.name.startswith((".", "_"))
              and p.name not in {"docs"}
          )
          problems = []
          for slug in slugs:
              for rel in ("project.json", "main.py", "docs/README.md"):
                  if not (root / slug / rel).is_file():
                      problems.append(f"{slug}: missing {rel}")
              for stray in (root / slug).rglob("*"):
                  if stray.name in {"LICENSE", "LICENSE.txt", "COPYING"}:
                      problems.append(
                          f"{slug}: stray {stray.relative_to(root)} — an in-repo object "
                          f"declares its licence in the manifest, never as a file")

          print(f"triples: cartridges={len(slugs)} problems={len(problems)}")
          for p in problems:
              print(f"  FAIL {p}")
          if not slugs:
              print("  FAIL scanned 0 cartridges — refusing to report success on an empty read")
              sys.exit(1)
          sys.exit(1 if problems else 0)
          PY

      - name: fc-spec check garment-manifest — every cartridge
        run: fc-spec check garment-manifest */project.json

  patterns:
    name: Pattern verification (render + seam parity)
    # The PR bar. The nightly sweep is `patterns-nightly` below.
    if: github.event_name != 'schedule'
    runs-on: ${{ vars.CI_RUNNER_LABEL != '' && vars.CI_RUNNER_LABEL || 'madfam-runners-blue' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────────────
      #  Render verification needs the `fc` drafting kernel and the sandbox, and
      #  both live in madfam-org/fashion-cabinet, which is PRIVATE. A default
      #  GITHUB_TOKEN cannot read another repository, so this job needs a token
      #  that does not exist yet: secrets.FC_PLATFORM_READ_TOKEN.
      #
      #  OPERATOR ITEM (GOVERNANCE.md, "Rulings this pipeline is waiting on" #5):
      #  mint a read-only token for madfam-org/fashion-cabinet and set it as the
      #  repository secret FC_PLATFORM_READ_TOKEN — or publish the kernel, which
      #  removes the need for a token at all.
      #
      #  Until then this job SKIPS LOUDLY. It does not silently pass: the notice
      #  below is written to the job summary, so a green tick on this repository
      #  never means "the patterns were verified" when they were not. A lane that
      #  did not run and a lane that passed must never look the same.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Is the platform kernel reachable?
        id: gate
        env:
          FC_PLATFORM_READ_TOKEN: ${{ secrets.FC_PLATFORM_READ_TOKEN }}
        run: |
          if [ -n "${FC_PLATFORM_READ_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "patterns: kernel token present — the render lane will run."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "patterns: SKIPPED — no kernel, nothing was rendered or seam-checked."
            {
              echo "### Pattern verification: SKIPPED — not verified"
              echo
              echo "The render + seam-parity lane did **not** run. It needs the \`fc\`"
              echo "drafting kernel from the private platform repository, and the"
              echo "repository secret \`FC_PLATFORM_READ_TOKEN\` is not set."
              echo
              echo "**This job being green does not mean the patterns are verified.**"
              echo "Only manifest conformance was checked on this run."
              echo
              echo "Operator step: GOVERNANCE.md → *Rulings this pipeline is waiting on* → item 5."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.available == 'true'
        with:
          python-version: "3.12"

      - name: Install the kernel + sandbox from the platform (pinned)
        if: steps.gate.outputs.available == 'true'
        env:
          FC_PLATFORM_READ_TOKEN: ${{ secrets.FC_PLATFORM_READ_TOKEN }}
          # The platform pin. Bump deliberately — it changes the kernel every
          # cartridge here is rendered against.
          FC_PLATFORM_PIN: e56247bee457b2e3adbb9dc5a4f88b33b21676f2
        run: |
          BASE="git+https://x-access-token:${FC_PLATFORM_READ_TOKEN}@github.com/madfam-org/fashion-cabinet@${FC_PLATFORM_PIN}"
          pip install "${BASE}#subdirectory=packages/kernel"
          pip install "${BASE}#subdirectory=packages/commons-sandbox"
          python -c "import fc; print('fc kernel available:', fc.__name__)"

      - name: Render + verify every cartridge
        if: steps.gate.outputs.available == 'true'
        # Read-proof and fail-closed: PatternSet.verify() error-level issues — an
        # open outline, a degenerate piece, a seam-length mismatch, a dangling
        # seam reference — are failures, and rendering zero cartridges is a
        # failure in its own right.
        run: |
          python3 - <<'PY'
          import json, pathlib, sys, traceback

          import fc

          root = pathlib.Path(".")
          slugs = sorted(
              p.name for p in root.iterdir()
              if p.is_dir() and (p / "main.py").is_file())

          rendered, problems = 0, []
          for slug in slugs:
              script = root / slug / "main.py"
              namespace = {"fc": fc, "math": __import__("math")}
              try:
                  exec(compile(script.read_text("utf-8"), str(script), "exec"), namespace)
                  result = namespace.get("result")
                  if result is None:
                      problems.append(f"{slug}: script assigned no top-level `result`")
                      continue
                  issues = [i for i in result.verify() if getattr(i, "level", "error") == "error"]
                  if issues:
                      problems.append(f"{slug}: {len(issues)} error-level issue(s): "
                                      + "; ".join(str(i) for i in issues[:3]))
                  else:
                      rendered += 1
              except Exception:
                  problems.append(f"{slug}: raised\n" + traceback.format_exc(limit=3))

          print(f"patterns: cartridges={len(slugs)} rendered={rendered} failures={len(problems)}")
          for p in problems:
              print(f"  FAIL {p}")
          if not slugs:
              print("  FAIL rendered 0 cartridges — refusing to report success on an empty read")
              sys.exit(1)
          sys.exit(1 if problems else 0)
          PY

  # ───────────────────────────────────────────────────────────────────────────
  #  A red sweep must reach a human.
  #
  #  The 2026-08-26 availability audit found that no alert from this estate ever
  #  had. `patterns` above verifies every cartridge on a pull request, but it
  #  fails into a run log on a branch nobody revisits — and it SKIPS entirely
  #  while the kernel token is unset. Neither shape tells anyone that the
  #  commons went red.
  #
  #  This job is the same verification, run nightly over all cartridges, whose
  #  RED opens or updates ONE tracking issue labelled `nightly-sweep` in this
  #  repository — the table of failing patterns and a comment naming what broke
  #  and what got fixed since the previous red run. A green sweep closes it, so
  #  the alert clears itself instead of training everyone to ignore it.
  #  See .github/scripts/nightly_report.py.
  # ───────────────────────────────────────────────────────────────────────────
  patterns-nightly:
    name: Nightly pattern sweep (all cartridges)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CI_RUNNER_LABEL != '' && vars.CI_RUNNER_LABEL || 'madfam-runners-blue' }}
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      # Dispatch-only escape hatch: feed the reporter a committed fixture log so
      # the issue open/update/close path can be exercised without a kernel and
      # without inventing a fake failure in a real cartridge. Every step below
      # is skipped on a fixture run.
      - name: Reporter dry run (fixture, no rendering)
        if: inputs.report_fixture != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN_FALLBACK: ${{ secrets.MADFAM_BOT_PAT }}
        run: |
          fixture="${{ inputs.report_fixture }}"
          test -f "$fixture" || { echo "::error::fixture $fixture not found"; exit 1; }
          python3 .github/scripts/nightly_report.py --selftest "$fixture"
          python3 .github/scripts/nightly_report.py \
            --log "$fixture" --workflow "CI · nightly pattern sweep (FIXTURE)"

      # Same gate as `patterns`, and for the same reason: the `fc` drafting
      # kernel lives in the PRIVATE platform repository. A nightly that cannot
      # render must not report a green sweep — it reports NOTHING, loudly, and
      # leaves any open tracking issue alone. "Did not run" and "passed" must
      # never look the same, and neither may close an alert.
      - name: Is the platform kernel reachable?
        id: gate
        if: inputs.report_fixture == ''
        env:
          FC_PLATFORM_READ_TOKEN: ${{ secrets.FC_PLATFORM_READ_TOKEN }}
        run: |
          if [ -n "${FC_PLATFORM_READ_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "nightly: kernel token present — the sweep will run."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "nightly: SKIPPED — no kernel, nothing was rendered or seam-checked."
            {
              echo "### Nightly pattern sweep: SKIPPED — not verified"
              echo
              echo "The sweep did **not** run: the repository secret"
              echo "\`FC_PLATFORM_READ_TOKEN\` is unset, so the \`fc\` kernel could not"
              echo "be installed. No tracking issue was opened OR closed — a lane that"
              echo "did not run must not clear an alert."
              echo
              echo "Operator step: GOVERNANCE.md → *Rulings this pipeline is waiting on* → item 5."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@v5
        if: inputs.report_fixture == '' && steps.gate.outputs.available == 'true'
        with:
          python-version: "3.12"

      - name: Install the kernel + sandbox from the platform (pinned)
        if: inputs.report_fixture == '' && steps.gate.outputs.available == 'true'
        env:
          FC_PLATFORM_READ_TOKEN: ${{ secrets.FC_PLATFORM_READ_TOKEN }}
          # The platform pin — the same one the per-PR `patterns` job uses.
          FC_PLATFORM_PIN: e56247bee457b2e3adbb9dc5a4f88b33b21676f2
        run: |
          BASE="git+https://x-access-token:${FC_PLATFORM_READ_TOKEN}@github.com/madfam-org/fashion-cabinet@${FC_PLATFORM_PIN}"
          pip install "${BASE}#subdirectory=packages/kernel"
          pip install "${BASE}#subdirectory=packages/commons-sandbox"
          python -c "import fc; print('fc kernel available:', fc.__name__)"

      - name: Render + verify every cartridge
        id: sweep
        if: inputs.report_fixture == '' && steps.gate.outputs.available == 'true'
        # The same verification the per-PR `patterns` job runs, over the whole
        # commons — tee'd to a file so the reporter below has something to parse.
        # `status` rather than `set -e`: the summary and the report must run
        # even when — especially when — the sweep failed. The default shell is
        # `bash -e -o pipefail`, so `$?` after the pipe is the SWEEP's code.
        run: |
          status=0
          python3 - <<'PY' | tee sweep-report.txt || status=$?
          import pathlib, sys, traceback

          import fc

          root = pathlib.Path(".")
          slugs = sorted(
              p.name for p in root.iterdir()
              if p.is_dir() and (p / "main.py").is_file())

          rendered, problems = 0, []
          for slug in slugs:
              script = root / slug / "main.py"
              namespace = {"fc": fc, "math": __import__("math")}
              try:
                  exec(compile(script.read_text("utf-8"), str(script), "exec"), namespace)
                  result = namespace.get("result")
                  if result is None:
                      problems.append(f"{slug}: script assigned no top-level `result`")
                      continue
                  issues = [i for i in result.verify() if getattr(i, "level", "error") == "error"]
                  if issues:
                      problems.append(f"{slug}: {len(issues)} error-level issue(s): "
                                      + "; ".join(str(i) for i in issues[:3]))
                  else:
                      rendered += 1
              except Exception:
                  problems.append(f"{slug}: raised " + " ".join(
                      traceback.format_exc(limit=3).split()))

          print(f"patterns: cartridges={len(slugs)} rendered={rendered} failures={len(problems)}")
          for p in problems:
              print(f"  FAIL {p}")
          if not slugs:
              print("  FAIL rendered 0 cartridges — refusing to report success on an empty read")
              sys.exit(1)
          sys.exit(1 if problems else 0)
          PY
          {
            echo "### Nightly pattern sweep"
            tail -1 sweep-report.txt
            grep "FAIL" sweep-report.txt | head -40 || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Reporting never fails the sweep: the script exits 0 after an
      # `::error::` annotation if it cannot reach the API. An alerting path that
      # turns a green sweep red is worse than the silence it replaces.
      - name: Report the red sweep to its tracking issue
        if: failure() && steps.sweep.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN_FALLBACK: ${{ secrets.MADFAM_BOT_PAT }}
        run: |
          python3 .github/scripts/nightly_report.py \
            --log sweep-report.txt \
            --workflow "CI · nightly pattern sweep"

      - name: Close the tracking issue when the sweep is green
        if: success() && steps.sweep.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN_FALLBACK: ${{ secrets.MADFAM_BOT_PAT }}
        run: python3 .github/scripts/nightly_report.py --green
